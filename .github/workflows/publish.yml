name: Publish

on:
    push:
        branches: [main]

env:
    # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10
    NODE_LTS_VERSION: 24

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    id-token: write # npm trusted publishing (OIDC)

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_LTS_VERSION }}
                  registry-url: https://registry.npmjs.org
                  # No dependency cache here: npm advises against caching in OIDC release builds

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

            - name: Create Release PR or Publish
              id: changesets
              if: github.repository == 'pooyagolchian/dirham'
              uses: changesets/action@v1
              with:
                  publish: pnpm release
                  title: "chore: version packages"
                  commit: "chore: version packages"
                  createGithubReleases: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Fail the publish instead of silently skipping the provenance attestation
                  NPM_CONFIG_PROVENANCE: "true"

            - name: Summary
              if: steps.changesets.outputs.published == 'true'
              run: |
                  echo "### Published packages" >> "$GITHUB_STEP_SUMMARY"
                  echo '${{ steps.changesets.outputs.publishedPackages }}' | \
                      python3 -c "import sys,json; [print('- **'+p['name']+'** v'+p['version']) for p in json.load(sys.stdin)]" >> "$GITHUB_STEP_SUMMARY"
